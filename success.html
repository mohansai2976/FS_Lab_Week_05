<html>
    <head>
        <title>Success-Page</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href = "styles.css">
    </head>

    <header>
        <div class="heading">
            <img src="logo.png" alt="Logo">
            <div class="text">
            <h1>Anil Neerukonda Institute of Technology & Sciences</h1>
            <h2>Campus Placement Portal</h2>
            </div>
        </div>
    </header>
        <div class="navbar">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Apply Job</a>
            <a href="#">UpComing Placements</a>
            <a href="#">Contact</a>
        </div>
    
    <body>
        <div class="box">
            <h2 style="color: green; margin-left: 5px;">Login Successful!</h2>
            <p style="color: darkblue;margin-left: 5px;">Welcome to ANITS Central Placement Portal</p>
            <p id="loginTime"></p>
            <p id="greeting"></p>
        </div>
        <script>
            let now=new Date();
            let hours=now.getHours();
            let greet="";
            let time=setTimeout(timeUp,10000);
            function resetTimer(){
                clearTimeout(time);
                time=setTimeout(timeUp,10000);
            }
            window.addEventListener("click",resetTimer);
            window.addEventListener("mousedown",resetTimer);
            window.addEventListener("mouseup",resetTimer);
            window.addEventListener("mousedown",resetTimer);
            window.addEventListener("keydown",resetTimer);
            window.addEventListener("submit",resetTimer);
            window.addEventListener("keypress",resetTimer);
            
            function timeUp(){
                alert("Page redirected");
                window.location.href="index.html";
            }
           
            if(hours<12){
                greet="Good Morning!";
            }

            else if(hours<17){
                greet="Good Afternoon!";
            }

            else if(hours<21){
                greet="Good Evening!";
            }

            else{
                greet="Good Night!"
            }

            document.getElementById("greeting").innerHTML=greet;
            document.getElementById("loginTime").innerHTML="Login Time :"+now.toLocaleTimeString();
        </script>
    </body>
</html>
